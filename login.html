<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Energy Dashboard – Login</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --error: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e3a2f 0%, var(--bg) 60%);
      color: var(--text);
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .brand svg { width: 32px; height: 32px; color: var(--accent); }

    h1 { font-size: 1.4rem; font-weight: 600; }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--muted);
    }

    .input-wrap { position: relative; }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 12px;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: var(--accent); }
    input.invalid { border-color: var(--error); }

    .toggle-pw {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 6px;
    }

    .toggle-pw:hover { color: var(--text); }

    .error-msg {
      color: var(--error);
      font-size: 0.8rem;
      margin-top: 6px;
      min-height: 1em;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 22px;
      color: var(--muted);
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      cursor: pointer;
    }

    .options a { color: var(--accent); text-decoration: none; }
    .options a:hover { text-decoration: underline; }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button[type="submit"]:hover { background: var(--accent-hover); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

    .form-status {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 14px;
      min-height: 1.2em;
    }

    .form-status.error { color: var(--error); }
    .form-status.success { color: var(--accent); }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" />
      </svg>
      <h1>Energy Dashboard</h1>
    </div>
    <p class="subtitle">Sign in to continue</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
        <div class="error-msg" id="usernameError"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" required />
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">Show</button>
        </div>
        <div class="error-msg" id="passwordError"></div>
      </div>

      <div class="options">
        <label><input type="checkbox" id="remember" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" id="submitBtn">Sign In</button>
      <p class="form-status" id="formStatus" role="status"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const togglePw = document.getElementById("togglePw");
    const submitBtn = document.getElementById("submitBtn");
    const formStatus = document.getElementById("formStatus");

    togglePw.addEventListener("click", () => {
      const hidden = password.type === "password";
      password.type = hidden ? "text" : "password";
      togglePw.textContent = hidden ? "Hide" : "Show";
      togglePw.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
    });

    function setError(input, message) {
      document.getElementById(input.id + "Error").textContent = message;
      input.classList.toggle("invalid", Boolean(message));
    }

    function validate() {
      let ok = true;
      if (!username.value.trim()) {
        setError(username, "Username is required.");
        ok = false;
      } else {
        setError(username, "");
      }
      if (!password.value) {
        setError(password, "Password is required.");
        ok = false;
      } else if (password.value.length < 6) {
        setError(password, "Password must be at least 6 characters.");
        ok = false;
      } else {
        setError(password, "");
      }
      return ok;
    }

    [username, password].forEach((el) =>
      el.addEventListener("input", () => setError(el, ""))
    );

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formStatus.textContent = "";
      formStatus.className = "form-status";
      if (!validate()) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      try {
        // TODO: replace with a real backend call, e.g.
        // const res = await fetch("/api/login", {
        //   method: "POST",
        //   headers: { "Content-Type": "application/json" },
        //   body: JSON.stringify({ username: username.value.trim(), password: password.value }),
        // });
        // if (!res.ok) throw new Error("Invalid username or password.");
        await new Promise((r) => setTimeout(r, 600));

        formStatus.textContent = "Login successful!";
        formStatus.classList.add("success");
        // window.location.href = "dashboard.html";
      } catch (err) {
        formStatus.textContent = err.message || "Login failed. Please try again.";
        formStatus.classList.add("error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
